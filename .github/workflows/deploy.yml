name: AWS OIDC Deployment

on:
  push:
    branches:
      - main

# Required permissions for OIDC authentication
permissions:
  id-token: write # Needed to request the JWT token from GitHub
  contents: read # Needed to check out your repository code

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::509820673633:role/GitHubActions-OIDC-Role
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity
