name: Security Quality Gate
# Triggers automated workflow when code is pushed to branch
on:
  push:
    branches:
      - main

jobs:
  tfsec_scan:
    name: tfsec SAST Scanner
    # Spins temp linux virtual runner in GitHub's cloud to run checks
    runs-on: ubuntu-latest

    steps:
      # Pulls copy of repo into virtual runner so tools can see code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Runs the tfsec scanner across terraform files
      - name: Run tfsec
        uses: aquasecurity/tfsec-pr-commenter-action@v1.2.0
        with:
          # CRUCIAL - instructs the pipeline to return a non-zero exit code and block deployment
          tfsec_args: "--soft-fail=false"
          github_token: ${{ secrets.GITHUB_TOKEN }}
